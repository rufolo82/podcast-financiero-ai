name: Podcast Financiero Diario (08:00 y 20:00 Madrid)

on:
  schedule:
    # --- MAÑANA (08:00 Madrid) ---
    # Verano CEST (UTC+2): 07:53, 08:01, 08:08, 08:16 Madrid (minutos descolapsados)
    - cron: '53 5 * * *'
    - cron: '1 6 * * *'
    - cron: '8 6 * * *'
    - cron: '16 6 * * *'
    # Invierno CET (UTC+1): 07:53, 08:01, 08:08, 08:16 Madrid
    - cron: '53 6 * * *'
    - cron: '1 7 * * *'
    - cron: '8 7 * * *'
    - cron: '16 7 * * *'

    # --- NOCHE (20:00 Madrid) ---
    # Verano CEST (UTC+2): 19:53, 20:01, 20:08, 20:16 Madrid (minutos descolapsados)
    - cron: '53 17 * * *'
    - cron: '1 18 * * *'
    - cron: '8 18 * * *'
    - cron: '16 18 * * *'
    # Invierno CET (UTC+1): 19:53, 20:01, 20:08, 20:16 Madrid
    - cron: '53 18 * * *'
    - cron: '1 19 * * *'
    - cron: '8 19 * * *'
    - cron: '16 19 * * *'

  workflow_dispatch: # Permite ejecución manual o llamada API instantánea
    inputs:
      force:
        description: 'Forzar ejecucion manual ignorando horario'
        required: false
        default: false
        type: boolean

jobs:
  generar-y-enviar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar ventana horaria puntual de España (08:00 y 20:00)
        id: check_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          HM=$(TZ="Europe/Madrid" date +%H%M)
          echo "Hora actual en Madrid: $HM (Evento: $EVENT_NAME, Forzar: $FORCE_RUN)"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "⚡ Forzado manual explícito activado. Saltando comprobación horaria."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Ventana estricta puntual: Mañana (07:45 a 08:30) | Noche (19:45 a 20:30)
          if { [ "$HM" -ge 0745 ] && [ "$HM" -le 0830 ]; } || { [ "$HM" -ge 1945 ] && [ "$HM" -le 2030 ]; }; then
            echo "✅ Dentro de ventana horaria puntual en España ($HM). Continuando..."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏹️ Fuera de ventana horaria puntual ($HM). Cancelando para evitar envíos a deshoras."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Descargar código del repositorio
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar Podcast (Con control anti-duplicados IMAP)
        if: steps.check_time.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          VOICE_ANA: es-ES-Chirp3-HD-Aoede
          VOICE_CARLOS: es-ES-Chirp3-HD-Fenrir
          TTS_SPEAKING_RATE: '1.02'
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          python -c "
          import os, main
          is_forced = (os.getenv('FORCE_RUN', 'false').lower() == 'true')
          main.run_workflow(scheduled_mode=(not is_forced))
          "
