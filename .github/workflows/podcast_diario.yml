name: Podcast Financiero Diario (08:00 y 20:00 Madrid)

on:
  schedule:
    # --- MAÑANA (08:00 Madrid) ---
    # Verano CEST (UTC+2): 07:53, 08:01, 08:08, 08:16 Madrid (minutos descolapsados)
    - cron: '53 5 * * *'
    - cron: '1 6 * * *'
    - cron: '8 6 * * *'
    - cron: '16 6 * * *'
    # Invierno CET (UTC+1): 07:53, 08:01, 08:08, 08:16 Madrid
    - cron: '53 6 * * *'
    - cron: '1 7 * * *'
    - cron: '8 7 * * *'
    - cron: '16 7 * * *'

    # --- NOCHE (20:00 Madrid) ---
    # Verano CEST (UTC+2): 19:53, 20:01, 20:08, 20:16 Madrid (minutos descolapsados)
    - cron: '53 17 * * *'
    - cron: '1 18 * * *'
    - cron: '8 18 * * *'
    - cron: '16 18 * * *'
    # Invierno CET (UTC+1): 19:53, 20:01, 20:08, 20:16 Madrid
    - cron: '53 18 * * *'
    - cron: '1 19 * * *'
    - cron: '8 19 * * *'
    - cron: '16 19 * * *'

  workflow_dispatch: # Permite ejecución manual o llamada API instantánea
    inputs:
      force:
        description: 'Forzar ejecucion manual ignorando horario'
        required: false
        default: false
        type: boolean

jobs:
  generar-y-enviar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Sincronizar y esperar al horario puntual de emision (08:00 y 20:00)
        id: check_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          python3 -c "
          import os, sys, time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          force = (os.getenv('FORCE_RUN', 'false').lower() == 'true')
          if force:
              print('⚡ Forzado manual activo. Saltando espera horaria.')
              with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
                  f.write('should_run=true\n')
              sys.exit(0)

          madrid = ZoneInfo('Europe/Madrid')
          now = datetime.now(madrid)
          hm = now.hour * 60 + now.minute

          # Franja Mañana: 07:00 a 08:30 (Si despierta temprano a las 07:14, espera a las 08:00:00 exactas)
          if 420 <= hm <= 510:
              target = now.replace(hour=8, minute=0, second=0, microsecond=0)
              wait_sec = max(0, int((target - now).total_seconds()))
              slot = 'MANANA'
          # Franja Noche: 19:00 a 20:45 (Si despierta temprano, espera a las 20:00:00 exactas)
          elif 1140 <= hm <= 1245:
              target = now.replace(hour=20, minute=0, second=0, microsecond=0)
              wait_sec = max(0, int((target - now).total_seconds()))
              slot = 'NOCHE'
          else:
              print(f'⏹️ Fuera de franja de emision ({now.strftime(\"%H:%M\")} Madrid). Cancelando para evitar envios a deshoras.')
              with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
                  f.write('should_run=false\n')
              sys.exit(0)

          if wait_sec > 0:
              m, s = divmod(wait_sec, 60)
              print(f'⏰ Despertador en la nube detectado a las {now.strftime(\"%H:%M:%S\")} Madrid.')
              print(f'🎯 Horario objetivo: {target.strftime(\"%H:%M:%S\")} Madrid.')
              print(f'⏳ Sincronizando en la nube: esperando {wait_sec}s ({m}m {s}s) para emitir exactamente a las {target.strftime(\"%H:%M\")}...')
              remaining = wait_sec
              while remaining > 0:
                  chunk = min(remaining, 300)
                  time.sleep(chunk)
                  remaining -= chunk
                  now_curr = datetime.now(madrid)
                  if remaining > 0:
                      print(f'⏳ Sincronizando... Faltan {remaining // 60} min (Hora actual: {now_curr.strftime(\"%H:%M:%S\")})', flush=True)

          now_final = datetime.now(madrid)
          print(f'✅ ¡Hora puntual alcanzada ({now_final.strftime(\"%H:%M:%S\")} Madrid)! Iniciando produccion del podcast.')
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
              f.write('should_run=true\n')
          "

      - name: Descargar código del repositorio
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar Podcast (Con control anti-duplicados IMAP)
        if: steps.check_time.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          VOICE_ANA: es-ES-Chirp3-HD-Aoede
          VOICE_CARLOS: es-ES-Chirp3-HD-Fenrir
          TTS_SPEAKING_RATE: '1.02'
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          python -c "
          import os, main
          is_forced = (os.getenv('FORCE_RUN', 'false').lower() == 'true')
          main.run_workflow(scheduled_mode=(not is_forced))
          "
