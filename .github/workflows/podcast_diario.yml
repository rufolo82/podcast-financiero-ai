name: Podcast Financiero Diario (07:00 y 20:00 Madrid)

on:
  schedule:
    # --- MAÑANA (07:00 Madrid) ---
    # Verano CEST (UTC+2): 04:45, 05:00, 05:15 UTC
    - cron: '45 4 * * *'
    - cron: '0 5 * * *'
    - cron: '15 5 * * *'
    # Invierno CET (UTC+1): 05:45, 06:00, 06:15 UTC
    - cron: '45 5 * * *'
    - cron: '0 6 * * *'
    - cron: '15 6 * * *'

    # --- NOCHE (20:00 Madrid) ---
    # Verano CEST (UTC+2): 17:45, 18:00, 18:15 UTC
    - cron: '45 17 * * *'
    - cron: '0 18 * * *'
    - cron: '15 18 * * *'
    # Invierno CET (UTC+1): 18:45, 19:00, 19:15 UTC
    - cron: '45 18 * * *'
    - cron: '0 19 * * *'
    - cron: '15 19 * * *'

  workflow_dispatch: # Permite ejecutarlo manualmente en cualquier momento

jobs:
  generar-y-enviar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar si estamos en franja de emisión de España
        id: check_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HM=$(TZ="Europe/Madrid" date +%H%M)
          echo "Hora actual en Madrid: $HM (Evento: $EVENT_NAME)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Franja Mañana (07:00): 06:30 a 13:30 | Franja Noche (20:00): 19:30 a 23:30
          if { [ "$HM" -ge 0630 ] && [ "$HM" -le 1330 ]; } || { [ "$HM" -ge 1930 ] && [ "$HM" -le 2330 ]; }; then
            echo "✅ Dentro de franja horaria activa en España ($HM). Continuando..."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏹️ Fuera de franja horaria ($HM). Saliendo sin emitir."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Descargar código del repositorio
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar Podcast (Con control anti-duplicados IMAP)
        if: steps.check_time.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          VOICE_ANA: es-ES-Neural2-A
          VOICE_CARLOS: es-ES-Neural2-F
          TTS_SPEAKING_RATE: '1.05'
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -c "
          import os, main
          event_name = os.getenv('EVENT_NAME', '')
          is_scheduled = (event_name == 'schedule')
          main.run_workflow(scheduled_mode=is_scheduled)
          "
