name: Podcast Financiero Diario (07:00 y 20:00 Madrid)

on:
  schedule:
    # Pulso cada 20 minutos para absorber cualquier retraso en la cola de GitHub Actions
    # El filtro en Bash descarta en 0.01s cualquier ejecución fuera de las 07:00 o 20:00 Madrid
    - cron: '*/20 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente en cualquier momento

jobs:
  generar-y-enviar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar si estamos en ventana de 07:00 o 20:00 (Hora de España)
        id: check_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HM=$(TZ="Europe/Madrid" date +%H%M)
          echo "Hora actual en Madrid: $HM (Evento: $EVENT_NAME)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Ventana Mañana: 06:50 a 09:30 Madrid | Ventana Noche: 19:50 a 22:00 Madrid
          if { [ "$HM" -ge 0650 ] && [ "$HM" -le 0930 ]; } || { [ "$HM" -ge 1950 ] && [ "$HM" -le 2200 ]; }; then
            echo "✅ Dentro de ventana horaria de emisión en España ($HM). Continuando..."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏹️ Fuera de ventana horaria ($HM). Saliendo en 0.01s."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Descargar código del repositorio
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Ejecutar Podcast (Con control anti-duplicados IMAP)
        if: steps.check_time.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          VOICE_ANA: es-ES-Neural2-A
          VOICE_CARLOS: es-ES-Neural2-F
          TTS_SPEAKING_RATE: '1.05'
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -c "
          import os, main
          event_name = os.getenv('EVENT_NAME', '')
          is_scheduled = (event_name == 'schedule')
          main.run_workflow(scheduled_mode=is_scheduled)
          "
