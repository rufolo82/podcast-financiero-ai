name: Podcast Financiero Diario (08:00 y 21:00 Madrid)

on:
  schedule:
    # Minutos :53 y :08 para evitar la saturación mundial del minuto :00 en GitHub Actions
    # Horario de Verano (CEST = UTC+2): ~08:00 Madrid y ~21:00 Madrid
    - cron: '53 5 * * *'
    - cron: '8 6 * * *'
    - cron: '53 18 * * *'
    - cron: '8 19 * * *'
    # Horario de Invierno (CET = UTC+1): ~08:00 Madrid y ~21:00 Madrid
    - cron: '53 6 * * *'
    - cron: '8 7 * * *'
    - cron: '53 19 * * *'
    - cron: '8 20 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente en cualquier momento

jobs:
  generar-y-enviar-podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Podcast (Con control de horario España y anti-duplicados)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          VOICE_ANA: es-ES-Neural2-A
          VOICE_CARLOS: es-ES-Neural2-F
          TTS_SPEAKING_RATE: '1.05'
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -c "
          import os, main
          event_name = os.getenv('EVENT_NAME', '')
          is_scheduled = (event_name == 'schedule')
          main.run_workflow(scheduled_mode=is_scheduled)
          "
